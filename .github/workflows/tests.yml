name: Tests

# Every push to any branch and every pull request runs the full release
# certification: tests, integrity audit and approved reference workbooks.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Certify (Linux, with a virtual display for desktop tests)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/ReleaseCheck.py --release

      - name: Certify (Windows)
        if: runner.os == 'Windows'
        run: python tools/ReleaseCheck.py --release
